name: Telegram Hype Bot
on:
  pull_request:
    types: [closed]
    branches:
      - dev
      - prod

jobs:
  notify:
    # This ensures the message ONLY sends if the PR was actually merged, not just closed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Extract Jira ID & Format Line
        id: extract_jira
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        # Scans the PR title (e.g., [AT-5]) and saves just the "AT-5" part as an output
        run: |
          JIRA_ID=$(echo "$PR_TITLE" | grep -oE '[A-Z]+-[0-9]+' | head -n 1 || echo "")
          TICKET_LINE=""
          if [ -n "$JIRA_ID" ]; then
            # Formatted in HTML to match the direct API payload
            TICKET_LINE="🎫 <b>Jira Ticket:</b> <a href=\"https://vorakyun.atlassian.net/browse/$JIRA_ID\">$JIRA_ID</a>"
          fi
          echo "ticket_line=$TICKET_LINE" >> $GITHUB_OUTPUT

      - name: Send Telegram Message directly via API
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          TICKET_LINE: ${{ steps.extract_jira.outputs.ticket_line }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          function map_user() {
            case "$1" in
              "SORIYAHO") echo "@yaIssMe" ;;
              "Visal2442") echo "@Sork_Visal" ;;
              "Johnrak11") echo "@johnrak" ;;
              "seangengise") echo "@ith_seang_eng" ;;
              *) echo "@$1" ;;
            esac
          }

          TG_MERGED_BY=$(map_user "$PR_MERGED_BY")
          TG_USER=$(map_user "$PR_USER")

          if [ "$TARGET_BRANCH" = "prod" ] || [ "$TARGET_BRANCH" = "main" ]; then
            jq -n \
              --arg chat_id "${{ secrets.TELEGRAM_CHAT_ID }}" \
              --arg topic_id "${{ secrets.TELEGRAM_TOPIC_ID }}" \
              '{
                chat_id: $chat_id,
                message_thread_id: $topic_id,
                parse_mode: "HTML",
                text: "Hello team lasted code from dev was merge to prod, server live on https://staging.routinecafe.site/"
              }' > payload.json
          else
            jq -n \
              --arg chat_id "${{ secrets.TELEGRAM_CHAT_ID }}" \
              --arg topic_id "${{ secrets.TELEGRAM_TOPIC_ID }}" \
              --arg title "$PR_TITLE" \
              --arg merged_by "$TG_MERGED_BY" \
              --arg user "$TG_USER" \
              --arg url "$PR_URL" \
              --arg ticket "$TICKET_LINE" \
              '{
                chat_id: $chat_id,
                message_thread_id: $topic_id,
                parse_mode: "HTML",
                text: ("Hello " + $user + " your PR was Merged to Dev (backend)!\n\n- Merged By: " + $merged_by + "\n- Assign to : " + $user + "\n📌 Task: " + $title + "\n" + (if $ticket != "" then $ticket + "\n\n" else "\n" end) + "🔗 <a href=\"" + $url + "\">View the Pull Request</a>\n\nEveryone pull the latest code and check it out! 🔥")
              }' > payload.json
          fi
            
          # Send it to Telegram and check for success
          RESPONSE=$(curl -S -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            -w "\n%{http_code}")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Response Body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Error: Telegram API returned HTTP $HTTP_STATUS"
            exit 1
          fi

          IS_OK=$(echo "$BODY" | jq -r '.ok')
          if [ "$IS_OK" != "true" ]; then
            echo "Error: Telegram API returned ok: false"
            exit 1
          fi
