name: Backend CI

on:
  push:
    branches: ['dev', 'prod', 'main', 'feature/**', 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: ['dev', 'prod', 'main']
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck and compile
        run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (dry run, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aeu-thesis-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a real .env is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it: git rm --cached .env"
            exit 1
          fi
          echo "OK: .env is not tracked."

  notify-dev-merge:
    name: Telegram Notification (dev merge)
    needs: [verify, docker-build, secret-scan]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Send Telegram Hype Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ACTOR: ${{ github.actor }}
          VERIFY_RES: ${{ needs.verify.result }}
          BUILD_RES: ${{ needs.docker-build.result }}
          SCAN_RES: ${{ needs.secret-scan.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured. Skipping notification."
            exit 0
          fi

          function map_user() {
            case "$1" in
              "SORIYAHO") echo "@yaIssMe" ;;
              "Visal2442") echo "@Sork_Visal" ;;
              "Johnrak11") echo "@johnrak" ;;
              "seangengise") echo "@ith_seang_eng" ;;
              *) echo "@$1" ;;
            esac
          }

          # The person who pushed the merge to dev is the fallback merger identity.
          MERGER_LOGIN="$ACTOR"
          # Author/assignee default to the merger until we can resolve the PR itself.
          AUTHOR_LOGIN="$ACTOR"
          ASSIGNEE_LOGIN=""
          TASK_TITLE=$(echo "$COMMIT_MSG" | head -n 1)
          LINK_URL="$COMMIT_URL"
          LINK_LABEL="View Commit on GitHub"

          # A merge to dev arrives as a push, so github.actor is the MERGER, not the PR
          # author. Recover the PR number from the merge commit ("Merge pull request #56 ..."
          # or a squash commit ending in "(#56)") and ask the GitHub API who actually
          # authored it, so the greeting mentions the developer instead of the merger.
          PR_NUMBER=$(echo "$COMMIT_MSG" | grep -oE '#[0-9]+' | head -n 1 | tr -d '#')
          if [ -n "$PR_NUMBER" ] && [ -n "$GH_TOKEN" ]; then
            PR_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER")

            API_AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login // empty')
            API_ASSIGNEE=$(echo "$PR_JSON" | jq -r '.assignee.login // (.assignees[0].login) // empty')
            API_MERGED_BY=$(echo "$PR_JSON" | jq -r '.merged_by.login // empty')
            API_TITLE=$(echo "$PR_JSON" | jq -r '.title // empty')
            API_URL=$(echo "$PR_JSON" | jq -r '.html_url // empty')

            [ -n "$API_AUTHOR" ] && AUTHOR_LOGIN="$API_AUTHOR"
            [ -n "$API_ASSIGNEE" ] && ASSIGNEE_LOGIN="$API_ASSIGNEE"
            [ -n "$API_MERGED_BY" ] && MERGER_LOGIN="$API_MERGED_BY"
            [ -n "$API_TITLE" ] && TASK_TITLE="$API_TITLE"
            if [ -n "$API_URL" ]; then
              LINK_URL="$API_URL"
              LINK_LABEL="View the Pull Request"
            fi
          fi

          # When the PR has no explicit assignee, treat the author as the assignee.
          [ -z "$ASSIGNEE_LOGIN" ] && ASSIGNEE_LOGIN="$AUTHOR_LOGIN"

          DEV_USER=$(map_user "$AUTHOR_LOGIN")
          MERGED_BY=$(map_user "$MERGER_LOGIN")
          ASSIGNEE=$(map_user "$ASSIGNEE_LOGIN")

          if [ -z "$TASK_TITLE" ]; then
            TASK_TITLE="Update dev branch"
          fi

          JIRA_ID=$(echo "$COMMIT_MSG $TASK_TITLE" | grep -oE '[A-Z]+-[0-9]+' | head -n 1 || echo "")
          TICKET_LINE=""
          if [ -n "$JIRA_ID" ]; then
            TICKET_LINE="🎫 <b>Jira Ticket:</b> <a href=\"https://vorakyun.atlassian.net/browse/$JIRA_ID\">$JIRA_ID</a>\n"
          fi

          if [ "$VERIFY_RES" = "success" ] && [ "$BUILD_RES" = "success" ] && [ "$SCAN_RES" = "success" ]; then
            MESSAGE="Hello $DEV_USER your PR was Merged to Dev (backend)! 🚀\n\n- 👤 <b>Merged By:</b> $MERGED_BY\n- 🙋 <b>Assign to:</b> $ASSIGNEE\n- 📌 <b>Task:</b> $TASK_TITLE\n${TICKET_LINE}- 🔗 <a href=\"$LINK_URL\">$LINK_LABEL</a>\n- 🚦 <b>CI Status:</b> ✅ Succeeded\n\nEveryone pull the latest code and check it out! 🔥"
          else
            MESSAGE="⚠️ <b>Backend CI Failed on Dev!</b> ❌\n\n- 👤 <b>Merged By:</b> $MERGED_BY\n- 🙋 <b>Assign to:</b> $ASSIGNEE\n- 📌 <b>Task:</b> $TASK_TITLE\n${TICKET_LINE}- 🔗 <a href=\"$LINK_URL\">$LINK_LABEL</a>\n- 🚦 <b>CI Status:</b> ❌ Failed (Please inspect Actions logs)"
          fi

          JSON_PAYLOAD=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg topic_id "$TELEGRAM_TOPIC_ID" \
            --arg text "$(echo -e "$MESSAGE")" \
            '{
              chat_id: $chat_id,
              parse_mode: "HTML",
              text: $text
            } + (if $topic_id != "" then {message_thread_id: $topic_id} else {} end)')

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" >/dev/null || true
