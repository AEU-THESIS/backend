name: Backend CI

on:
  push:
    branches: ['dev', 'prod', 'main', 'feature/**', 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: ['dev', 'prod', 'main']
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck and compile
        run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (dry run, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aeu-thesis-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a real .env is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it: git rm --cached .env"
            exit 1
          fi
          echo "OK: .env is not tracked."

  notify-dev-merge:
    name: Telegram Alert (dev merge)
    needs: [verify, docker-build, secret-scan]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && secrets.TELEGRAM_BOT_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          VERIFY_RES: ${{ needs.verify.result }}
          BUILD_RES: ${{ needs.docker-build.result }}
          SCAN_RES: ${{ needs.secret-scan.result }}
        run: |
          if [ "$VERIFY_RES" = "success" ] && [ "$BUILD_RES" = "success" ] && [ "$SCAN_RES" = "success" ]; then
            STATUS="✅ Succeeded"
          else
            STATUS="❌ Failed"
          fi

          TEXT="<b>🚀 Backend CI (${STATUS})</b>%0A<b>Branch:</b> <code>dev</code> (Merged)%0A<b>Author:</b> ${{ github.actor }}%0A<b>Commit:</b> <a href=\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\">${{ github.sha }}</a>"

          TOPIC_PARAM=""
          if [ -n "${{ secrets.TELEGRAM_TOPIC_ID }}" ]; then
            TOPIC_PARAM="&message_thread_id=${{ secrets.TELEGRAM_TOPIC_ID }}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}${TOPIC_PARAM}&parse_mode=HTML&text=${TEXT}" >/dev/null || true
