name: Deploy Backend (Production)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
      - '!v*-staging*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Docker image tag to deploy (e.g. v1.0.0)'
        required: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/routin-cafe-backend

concurrency:
  group: deploy-production-backend
  cancel-in-progress: false

jobs:
  verify:
    name: 1. Verify & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run build

  build-and-push:
    name: 2. Build & Push Image (GHCR)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: |
          LOWERCASE_IMAGE=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$LOWERCASE_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: 3. Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/projects/rountine-cafe/production"
            fi

            echo "==> Deploying backend to Production: $APP_DIR"
            cd "$APP_DIR"

            if [ ! -f .env ]; then
              echo "::error::.env is missing in $APP_DIR"
              exit 1
            fi

            chmod +x deploy.sh || true
            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}" SERVICE=backend ./deploy.sh

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          JOB_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured. Skipping notification."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="✅ Succeeded"
          else
            STATUS="❌ Failed"
          fi

          TEXT="<b>🟢 Backend Production Deploy (${STATUS})</b>%0A<b>Release Tag:</b> <code>${IMAGE_TAG}</code>%0A<b>Triggered by:</b> ${{ github.actor }}%0A<b>URL:</b> https://routinecafe.site"

          TOPIC_PARAM=""
          if [ -n "$TELEGRAM_TOPIC_ID" ]; then
            TOPIC_PARAM="&message_thread_id=${TELEGRAM_TOPIC_ID}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}${TOPIC_PARAM}&parse_mode=HTML&text=${TEXT}" >/dev/null || true
